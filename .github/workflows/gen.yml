name: FF Guest US
on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Cantidad (5-10 recomendado)'
        default: '5'
        required: true
      name:
        description: 'Nombre base'
        default: 'US'
        required: true
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pycryptodome
      - run: python gen_run.py --count ${{ inputs.count }} --name "${{ inputs.name }}" --region US
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuentas-us
          path: accounts.csv
