name: FF Guest US
on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Cantidad (máx 6 por tanda)'
        default: '6'
        required: true
      names:
        description: 'Nombres exactos separados por coma (opcional, 3-12 car. c/u)'
        default: ''
        required: false
      name:
        description: 'Nombre base (solo si no usás lista)'
        default: 'US'
        required: false
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pycryptodome
      - run: python gen_run.py --count ${{ inputs.count }} --names "${{ inputs.names }}" --name "${{ inputs.name }}" --region US
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuentas-us
          path: accounts.csv
